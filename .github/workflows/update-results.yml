name: Auto Update Live Results and Leaderboard

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab on GitHub

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Generate latest analysis and leaderboard
        run: node scripts/build.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/agent-analysis.json public/botmanen-summary.json
          # Commit only if there are changes to the JSON files
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live match results [skip ci]" && git push)
